<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TaskAssist AI</title>
<meta name="description" content="タスク実行を優先したAIアシスタント。広域Web検索でまとめた結果をファイル出力します。" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0e1116" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">

<div class="app-shell">

  <!-- ===================== Sidebar ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 6.5" stroke="#04120e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        TaskAssist AI
      </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      新しいチャット
    </button>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <button class="settings-btn" id="settingsBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ===================== Main ===================== -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7H20M4 12H20M4 17H20"/></svg>
      </button>
      <div class="brand" style="font-size:14px;">TaskAssist AI</div>
    </div>

    <div class="preview-bar" id="previewBar">
      <div class="preview-bar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <div class="preview-bar-name" id="previewBarName">調査結果.pdf</div>
      <div class="preview-bar-actions">
        <button title="プレビュー" id="previewBarPreview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button title="共有" id="previewBarShare">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6L8.6 10.5"/></svg>
        </button>
        <button title="ダウンロード" id="previewBarDownload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        </button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="messages-inner" id="messagesInner">
        <!-- empty state injected by JS -->
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="attach-preview-row" id="attachPreviewRow"></div>
        <div class="composer-input-row">
          <button class="icon-btn" id="attachBtn" title="ファイルを追加">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5V19M5 12H19"/></svg>
          </button>
          <input type="file" id="fileInput" multiple hidden />
          <textarea id="promptInput" rows="1" placeholder="最安値、特徴、マニアック情報を知りたい商品を入力…"></textarea>
          <div class="model-select-wrap">
            <button class="model-select-btn" id="modelSelectBtn">
              <span id="modelSelectLabel">Flash 3.7</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="model-menu" id="modelMenu">
              <button data-model="flash-3.7" class="selected"><b>Flash 3.7</b><span>高精度・広域検索向け</span></button>
              <button data-model="flash-lite-3.6"><b>Flash lite 3.6</b><span>高速・軽量タスク向け</span></button>
            </div>
          </div>
          <button class="send-btn" id="sendBtn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="#04120e"/></svg>
          </button>
        </div>
        <div class="output-format-row">
          <span>出力形式</span>
          <select id="outputFormat">
            <option value="pdf">PDF</option>
            <option value="md">Markdown</option>
            <option value="txt">テキスト</option>
          </select>
        </div>
      </div>
      <div class="composer-hint">TaskAssist AI は誤った情報を出力する場合があります。重要な情報は出典を確認してください。</div>
    </div>
  </main>
</div>

<!-- ===================== Settings Modal ===================== -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>設定</h2>
      <button class="modal-close" id="closeSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6L18 18M6 18L18 6"/></svg>
      </button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="api">API</button>
      <button class="tab-btn" data-tab="design">デザイン</button>
    </div>

    <div class="tab-panel active" data-panel="api">
      <div class="field">
        <label>Gemini APIキー</label>
        <div class="field-row">
          <input type="password" id="apiKeyInput" placeholder="AIza..." />
          <button class="reveal-btn" id="revealKeyBtn" title="表示/非表示">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-desc">Google AI Studioで発行したAPIキーを入力してください。キーは端末内にのみ保存され、外部サーバーへは送信されません。</div>
      </div>
      <div class="field">
        <label>既定モデル</label>
        <select id="defaultModelSelect">
          <option value="flash-3.7">Flash 3.7</option>
          <option value="flash-lite-3.6">Flash lite 3.6</option>
        </select>
      </div>
      <div class="field">
        <label>Web検索</label>
        <div class="field-desc" style="margin-top:0;">広域Web検索とURL取得を有効にして、最安値比較やマニアック情報の収集精度を高めます。</div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:500;font-size:12.5px;color:var(--text);">
          <input type="checkbox" id="webSearchToggle" checked style="width:16px;height:16px;" />
          広域Web検索を有効にする
        </label>
      </div>
    </div>

    <div class="tab-panel" data-panel="design">
      <div class="field">
        <label>テーマ</label>
        <div class="theme-grid">
          <button class="theme-option selected" data-theme="dark">
            <div class="theme-swatch" style="background:linear-gradient(135deg,#151a21,#0e1116);"></div>
            <span>ダーク</span>
          </button>
          <button class="theme-option" data-theme="light">
            <div class="theme-swatch" style="background:linear-gradient(135deg,#ffffff,#eef1f4);"></div>
            <span>ライト</span>
          </button>
          <button class="theme-option" data-theme="midnight">
            <div class="theme-swatch" style="background:linear-gradient(135deg,#12151d,#05060a);"></div>
            <span>ミッドナイト</span>
          </button>
        </div>
        <div class="field-desc">アクセントカラーはテーマに合わせて自動調整されます。</div>
      </div>
    </div>

    <div class="save-row">
      <button class="save-btn" id="saveSettingsBtn">保存する</button>
      <div class="save-toast" id="saveToast"></div>
    </div>
  </div>
</div>

<!-- ===================== Confirm Delete Dialog ===================== -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>チャットを削除しますか?</h3>
    <p>この操作は取り消せません。チャットの履歴とファイル出力の記録がすべて削除されます。</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancelBtn">キャンセル</button>
      <button class="confirm-delete" id="confirmDeleteBtn">削除する</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
